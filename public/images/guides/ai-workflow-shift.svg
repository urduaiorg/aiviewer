<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AI Workflow Shift</title>
  <desc id="desc">Editorial cover art with layered gradients and workflow nodes representing AI moving beyond chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F4EA" />
      <stop offset="0.52" stop-color="#F5F5F4" />
      <stop offset="1" stop-color="#EEF2FF" />
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(234 118) rotate(45) scale(220 220)">
      <stop stop-color="#F0C75E" stop-opacity="0.52" />
      <stop offset="1" stop-color="#F0C75E" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(962 164) rotate(135) scale(240 240)">
      <stop stop-color="#6366F1" stop-opacity="0.28" />
      <stop offset="1" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="630" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#18181B" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glowA)" />
  <rect width="1200" height="630" fill="url(#glowB)" />

  <circle cx="170" cy="520" r="160" fill="#F0C75E" fill-opacity="0.08" />
  <circle cx="1040" cy="120" r="140" fill="#6366F1" fill-opacity="0.08" />

  <g filter="url(#shadow)">
    <rect x="90" y="88" width="1020" height="454" rx="36" fill="white" fill-opacity="0.72" stroke="#E4E4E7" />
  </g>

  <g opacity="0.95">
    <rect x="140" y="150" width="184" height="56" rx="28" fill="#18181B" />
    <text x="232" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Chat</text>

    <rect x="474" y="150" width="252" height="56" rx="28" fill="#EDE9FE" stroke="#C7D2FE" />
    <text x="600" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#4338CA">Workflows</text>

    <rect x="826" y="150" width="220" height="56" rx="28" fill="#F0C75E" />
    <text x="936" y="185" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#18181B">Action</text>
  </g>

  <path d="M324 178H458" stroke="#A1A1AA" stroke-width="6" stroke-linecap="round" />
  <path d="M726 178H812" stroke="#A1A1AA" stroke-width="6" stroke-linecap="round" />
  <path d="M456 178L436 166M456 178L436 190" stroke="#A1A1AA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M812 178L792 166M812 178L792 190" stroke="#A1A1AA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <g>
    <rect x="140" y="274" width="280" height="164" rx="28" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="180" y="318" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181B">Research</text>
    <text x="180" y="352" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">papers, data,</text>
    <text x="180" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">and evidence</text>
    <circle cx="346" cy="350" r="22" fill="#F0C75E" fill-opacity="0.2" />
    <circle cx="346" cy="350" r="10" fill="#F0C75E" />

    <rect x="460" y="274" width="280" height="164" rx="28" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="500" y="318" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181B">Design</text>
    <text x="500" y="352" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">slides, mockups,</text>
    <text x="500" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">and prototypes</text>
    <circle cx="666" cy="350" r="22" fill="#6366F1" fill-opacity="0.18" />
    <circle cx="666" cy="350" r="10" fill="#6366F1" />

    <rect x="780" y="274" width="280" height="164" rx="28" fill="#FFFFFF" stroke="#E4E4E7" />
    <text x="820" y="318" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#18181B">Desktop</text>
    <text x="820" y="352" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">browser, files,</text>
    <text x="820" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#52525B">and apps</text>
    <circle cx="986" cy="350" r="22" fill="#18181B" fill-opacity="0.16" />
    <circle cx="986" cy="350" r="10" fill="#18181B" />
  </g>

  <text x="600" y="492" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#18181B">
    AI is moving from chat into the work itself
  </text>
</svg>
